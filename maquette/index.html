<title>Pawstuler Maquette</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ============================================================
   THÈME PAWSTULER — toutes les couleurs, polices et espacements
   sont ici (CLAUDE.md §7). Palette tirée des illustrations de Ziggy.
   ============================================================ */
:root{
  --page:#F1E4D8;          /* fond autour du téléphone */
  --creme:#FFF6EC;         /* fond de l'app (ventre de Ziggy) */
  --carte:#FFFFFF;
  --saumon:#F2906B;        /* pelage de Ziggy : couleur principale */
  --saumon-clair:#FDE4D7;
  --renard-fonce:#C4583A;  /* boutons, texte sur fond clair */
  --brun:#5E3A2C;          /* contour de Ziggy : texte principal */
  --brun-doux:#8A6B5E;
  --sauge:#A9C68E;
  --sauge-clair:#EAF1DF;
  --sauge-fonce:#557A45;
  --lac:#8EC5D6;
  --lac-clair:#E1F1F5;
  --corail:#FF4F5E;        /* réservé aux victoires (entretien, poste décroché) */
  --corail-clair:#FFE2E4;
  --ligne:#EEDCCB;
  --ombre:0 6px 18px rgba(94,58,44,.10);

  --f-titre:"Fredoka","Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-texte:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;

  --r-s:10px; --r-m:16px; --r-l:24px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page);color:var(--brun);font-family:var(--f-texte)}
body{padding-inline:16px;padding-block:20px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lac);outline-offset:2px}

/* ---------- Bandeau de revue (hors app) ---------- */
.revue{max-width:420px;margin:0 auto 14px;display:grid;gap:10px}
.revue h1{font-family:var(--f-titre);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.revue p{margin:0;font-size:13px;color:var(--brun-doux);line-height:1.45}
.puces{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.puces button{flex:none;border:1px solid var(--ligne);background:var(--carte);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.puces button.demo{background:var(--sauge-clair);border-color:transparent;color:var(--sauge-fonce)}

/* ---------- Téléphone ---------- */
.phone{position:relative;margin:0 auto;width:min(390px,100%);height:min(844px,calc(100dvh - 40px));min-height:640px;
  background:var(--creme);border-radius:46px;overflow:hidden;
  box-shadow:0 0 0 10px #2E211C,0 0 0 11px #4a372f,0 30px 60px rgba(60,35,25,.3)}
@media (max-width:440px){.phone{border-radius:28px;box-shadow:0 0 0 6px #2E211C,0 20px 40px rgba(60,35,25,.25)}}
.statut{position:absolute;inset:0 0 auto;height:48px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-weight:800;font-size:15px;pointer-events:none}
.statut .ic{display:flex;gap:5px;align-items:center}
.ecran{position:absolute;inset:0 0 82px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.ecran::-webkit-scrollbar{display:none}
.pad{padding:0 18px 24px}

/* ---------- Barre d'onglets ---------- */
.onglets{position:absolute;inset:auto 0 0;height:82px;background:var(--carte);border-top:1px solid var(--ligne);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 22px;z-index:20}
.onglets button{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--brun-doux)}
.onglets svg{width:26px;height:26px}
.onglets button[aria-current="page"]{color:var(--renard-fonce)}
.onglets button[aria-current="page"] .fond{fill:var(--saumon-clair)}

/* ---------- Titres ---------- */
.entete{padding:58px 18px 10px}
.entete h2{font-family:var(--f-titre);font-weight:600;font-size:28px;margin:0;line-height:1.1}
.entete p{margin:4px 0 0;color:var(--brun-doux);font-size:14px}
.section-titre{font-family:var(--f-titre);font-weight:600;font-size:19px;margin:22px 0 10px}

/* ---------- Ziggy (illustration ou dessin de secours) ---------- */
.ziggy{display:block}
.ziggy img,.ziggy svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){
  .respire{animation:respire 3.2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes respire{50%{transform:translateY(-4px) scale(1.01)}}
  .saut{animation:saut .6s ease-out}
  @keyframes saut{40%{transform:translateY(-18px)}}
}

/* ---------- Accueil : scène ---------- */
.scene{position:relative;height:390px;overflow:hidden;background:var(--lac-clair)}
.scene .decor,.scene .decor img,.scene .decor svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 88%}
.scene .ziggy{position:absolute;left:50%;bottom:34px;width:150px;transform:translateX(-50%)}
.bulle{position:absolute;top:62px;left:16px;right:16px;background:var(--carte);border-radius:18px;padding:10px 14px;font-weight:700;font-size:14px;line-height:1.35;box-shadow:var(--ombre)}
.bulle::after{content:"";position:absolute;bottom:-8px;left:50%;width:16px;height:16px;background:var(--carte);transform:rotate(45deg);border-radius:3px}
.bulle b{color:var(--renard-fonce)}
.date-accueil{position:absolute;top:48px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brun);opacity:0}

/* ---------- Jauge d'énergie ---------- */
.jauge{position:relative;margin:-28px 14px 0;background:var(--carte);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--ombre);z-index:2}
.jauge-haut{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jauge-haut strong{font-family:var(--f-titre);font-weight:600;font-size:16px}
.jauge-haut span{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.piste{position:relative;height:16px;border-radius:999px;background:var(--saumon-clair);margin:10px 0 6px;overflow:hidden}
.remplissage{height:100%;border-radius:999px;background:linear-gradient(90deg,#F7AE8D,var(--saumon));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.piste i{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(255,255,255,.8);border-radius:2px}
.jauge small{display:block;font-size:12.5px;color:var(--brun-doux);font-weight:600}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;font-size:15px;background:var(--renard-fonce);color:#fff;width:100%}
.btn.second{background:var(--saumon-clair);color:var(--renard-fonce)}
.btn.sauge{background:var(--sauge-fonce)}
.btn.victoire{background:var(--corail)}
.jauge .btn{margin-top:12px}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(242,144,107,.25)}}}

/* ---------- Tâches ---------- */
.etape{background:var(--carte);border-radius:var(--r-m);margin-bottom:10px;border:1px solid var(--ligne)}
.etape summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:800;font-size:15px;cursor:pointer}
.etape summary::-webkit-details-marker{display:none}
.etape summary .meta{font-size:12px;font-weight:700;color:var(--brun-doux);display:flex;align-items:center;gap:6px}
.etape summary .fleche{transition:transform .2s}
.etape[open] summary .fleche{transform:rotate(90deg)}
.tache{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ligne);padding:11px 14px}
.coche{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ligne);display:grid;place-items:center}
.tache.faite .coche{background:var(--sauge);border-color:var(--sauge)}
.tache .nom{font-weight:700;font-size:14px;line-height:1.3}
.tache .sous{display:block;font-size:12px;color:var(--brun-doux);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.gain{font-weight:800;font-size:13px;color:var(--renard-fonce);background:var(--saumon-clair);border-radius:999px;padding:4px 9px;white-space:nowrap}
.tache.plafond{opacity:.55}
.tache.auto .coche{border-style:dashed}
.tache.auto .gain{background:var(--lac-clair);color:#2F6D80}

/* ---------- Toast ---------- */
.toast{position:absolute;left:14px;right:14px;top:54px;z-index:60;background:var(--brun);color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--ombre);transition:transform .3s,opacity .3s}
.toast.cache{transform:translateY(-20px);opacity:0;pointer-events:none}
.toast.victoire{background:var(--corail)}
.toast b{font-variant-numeric:tabular-nums}

/* ---------- Candidatures ---------- */
.filtres{display:flex;gap:6px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;border:1px solid var(--ligne);background:var(--carte);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.filtres button[aria-pressed="true"]{background:var(--brun);color:#fff;border-color:var(--brun)}
.filtres button span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:3px}
.fiche{display:block;width:100%;text-align:left;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r-m);padding:14px;margin-bottom:10px}
.fiche-haut{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fiche h3{margin:0;font-size:16px;font-weight:800}
.fiche .poste{font-size:13.5px;color:var(--brun-doux);font-weight:600;margin-top:2px}
.etiq{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 8px;white-space:nowrap}
.etiq.offre{background:var(--lac-clair);color:#2F6D80}
.etiq.spont{background:var(--sauge-clair);color:var(--sauge-fonce)}
.etapes-fiche{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.pas{font-size:11.5px;font-weight:800;text-align:center;padding:6px 4px;border-radius:10px;background:#F7EFE7;color:#B9A396}
.pas.ok{background:var(--sauge-clair);color:var(--sauge-fonce)}
.pas.ok.entretien{background:var(--corail-clair);color:#C92F3D}
.fiche-bas{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--brun-doux)}
.reponse{font-weight:800;border-radius:999px;padding:3px 9px}
.reponse.attente{background:#F7EFE7;color:var(--brun-doux)}
.reponse.refus{background:#EDE7F4;color:#6A5A86}
.reponse.decroche{background:var(--corail);color:#fff}
.relance{color:var(--renard-fonce)}
.relance.due{background:var(--saumon-clair);border-radius:999px;padding:3px 9px}
.fab{position:absolute;right:18px;bottom:98px;z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--renard-fonce);color:#fff;box-shadow:0 8px 20px rgba(196,88,58,.4);display:grid;place-items:center}
.vide{text-align:center;padding:30px 20px;color:var(--brun-doux);font-weight:600}

/* ---------- Feuilles (sheets) et plein écran ---------- */
.voile{position:absolute;inset:0;z-index:40;background:rgba(46,33,28,.35);display:flex;align-items:flex-end}
.feuille{width:100%;max-height:90%;overflow-y:auto;background:var(--creme);border-radius:28px 28px 0 0;padding:10px 18px 30px}
.poignee{width:40px;height:5px;border-radius:5px;background:var(--ligne);margin:0 auto 12px}
.feuille h3{font-family:var(--f-titre);font-weight:600;font-size:22px;margin:0}
.feuille .poste{color:var(--brun-doux);font-weight:600;margin:2px 0 14px}
.bloc{background:var(--carte);border-radius:var(--r-m);border:1px solid var(--ligne);margin-bottom:12px}
.ligne-toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--ligne);font-weight:700;font-size:14.5px}
.ligne-toggle:first-child{border-top:0}
.ligne-toggle small{display:block;font-weight:600;color:var(--brun-doux);font-size:12px}
.interrupteur{flex:none;width:50px;height:30px;border-radius:999px;border:0;background:#E6D8CB;position:relative;transition:background .2s}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.interrupteur[aria-checked="true"]{background:var(--sauge-fonce)}
.interrupteur[aria-checked="true"]::after{transform:translateX(20px)}
.segment{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#F3E8DD;border-radius:14px;padding:4px}
.segment button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:13.5px}
.segment button[aria-pressed="true"]{background:var(--carte);box-shadow:0 1px 4px rgba(94,58,44,.15)}
.segment button.dec[aria-pressed="true"]{background:var(--corail);color:#fff}
.label{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brun-doux);margin:16px 0 6px}
.champ{width:100%;border:1px solid var(--ligne);background:var(--carte);border-radius:12px;padding:12px;font:inherit;font-weight:600;color:var(--brun)}
textarea.champ{min-height:84px;resize:vertical;line-height:1.4}
.infos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 14px;font-size:13.5px}
.infos dt{color:var(--brun-doux);font-weight:700}
.infos dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

.plein{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 26px 40px;gap:14px}
.plein.aventure{background:linear-gradient(#CFE8EA,#FBE3D4)}
.plein.reconfort{background:#F4EEF8}
.plein.fete{background:var(--corail-clair);overflow:hidden}
.plein .ziggy{width:190px}
.plein h3{font-family:var(--f-titre);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
.plein p{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;max-width:32ch}
.recit{background:var(--carte);border-radius:var(--r-l);padding:16px;text-align:left;box-shadow:var(--ombre);width:100%}
.recit p{max-width:none}
.recompense{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--ligne);font-weight:800}
.recompense .obj{width:48px;height:48px;border-radius:14px;background:var(--saumon-clair);display:grid;place-items:center;flex:none}
.recompense small{display:block;color:var(--brun-doux);font-weight:700;font-size:12px}
.plein .actions{display:grid;gap:8px;width:100%;margin-top:6px}
.confetti{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px}
@media (prefers-reduced-motion:no-preference){
  .confetti{animation:tombe linear infinite}
  @keyframes tombe{to{transform:translateY(900px) rotate(540deg)}}
  .marche{animation:marche 2.2s ease-in-out forwards}
  @keyframes marche{0%{transform:translateX(0)}100%{transform:translateX(130%)}}
}
.points{display:flex;gap:6px;justify-content:center}
.points i{width:8px;height:8px;border-radius:50%;background:var(--saumon);opacity:.3}
@media (prefers-reduced-motion:no-preference){.points i{animation:pt 1s infinite}.points i:nth-child(2){animation-delay:.2s}.points i:nth-child(3){animation-delay:.4s}@keyframes pt{50%{opacity:1}}}

/* ---------- Clairbourg ---------- */
.miroir{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compteur{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r-m);padding:12px 14px}
.compteur small{font-size:12px;font-weight:800;color:var(--brun-doux);text-transform:uppercase;letter-spacing:.05em}
.compteur strong{display:block;font-family:var(--f-titre);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.compteur span{font-size:12.5px;font-weight:600;color:var(--brun-doux)}
.bandeau-ville{position:relative;height:170px;border-radius:var(--r-l);overflow:hidden;margin:4px 0 0}
.bandeau-ville .vue{height:100%}
.bandeau-ville img,.bandeau-ville svg{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.lieu{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--ligne)}
.lieu:first-child{border-top:0}
.lieu .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sauge-clair)}
.lieu b{display:block;font-size:14.5px}
.lieu span{font-size:12.5px;font-weight:700;color:var(--brun-doux)}
.lieu .etat-entretien{color:#C92F3D}
.journal{position:relative;padding-left:18px}
.journal::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--ligne)}
.entree{position:relative;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r-m);padding:12px 14px;margin-bottom:10px}
.entree::before{content:"";position:absolute;left:-18px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--saumon);border:2px solid var(--creme)}
.entree time{font-size:12px;font-weight:800;color:var(--brun-doux);text-transform:uppercase;letter-spacing:.05em}
.entree p{margin:4px 0 0;font-size:14px;line-height:1.45;font-weight:600}
.entree .gagne{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--renard-fonce)}

/* ---------- Moi ---------- */
.profil{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r-l);padding:14px}
.profil .ziggy{width:110px}
.profil h3{font-family:var(--f-titre);font-weight:600;font-size:24px;margin:0}
.profil p{margin:2px 0 0;font-size:13.5px;color:var(--brun-doux);font-weight:600;line-height:1.4}
.porte{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.porte span{font-size:11.5px;font-weight:800;background:var(--saumon-clair);color:var(--renard-fonce);border-radius:999px;padding:3px 8px}
.garde-robe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.objet{border:1px solid var(--ligne);background:var(--carte);border-radius:var(--r-m);padding:10px 6px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:800;text-align:center;line-height:1.2}
.objet .obj{width:52px;height:52px;border-radius:14px;background:var(--saumon-clair);display:grid;place-items:center}
.objet[aria-pressed="true"]{border:2px solid var(--renard-fonce);padding:9px 5px}
.objet.verrou{opacity:.5}
.objet.verrou .obj{background:#F3E8DD}
.objet small{font-weight:700;color:var(--brun-doux);font-size:11px}
.badges{display:flex;gap:10px}
.badge{flex:1;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r-m);padding:12px;display:flex;gap:10px;align-items:center}
.badge .med{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#EDE7F4;flex:none}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;font-weight:700;color:var(--brun-doux)}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--ligne);font-weight:700;font-size:14.5px}
.reglage:first-child{border-top:0}
.reglage input{border:0;background:none;text-align:right;font:inherit;font-weight:800;color:var(--renard-fonce);width:50%;padding:4px}
.reglage .segment{width:190px}
.danger{color:#B3261E}
.note-maquette{font-size:12px;color:var(--brun-doux);font-weight:600;text-align:center;margin-top:18px;line-height:1.45}
</style>

<section class="revue" aria-label="Revue de maquette">
  <h1>Pawstuler · maquette cliquable</h1>
  <p>Étape 0 : Accueil et les 4 onglets. Coche des tâches, ouvre une candidature, remplis la jauge pour envoyer Ziggy en aventure. Les données sont des exemples.</p>
  <div class="puces" role="toolbar" aria-label="Raccourcis">
    <button data-aller="accueil">Accueil</button>
    <button data-aller="candidatures">Candidatures</button>
    <button data-aller="clairbourg">Clairbourg</button>
    <button data-aller="moi">Moi</button>
    <button class="demo" id="demo-jauge">Remplir la jauge</button>
    <button class="demo" id="demo-matin">Nouveau matin</button>
  </div>
</section>

<div class="phone" id="phone">
  <div class="statut" aria-hidden="true"><span>9:41</span><span class="ic">

</svg>`;

/* ============================================================

   ============================================================ */
const $ = s => document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const tx = s => s.replaceAll("{nom}", esc(etat.nom));
function joursDepuis(iso){ if(!iso) return null; const d=new Date(iso+"T00:00:00"); return Math.round((AUJOURDHUI-d)/864e5); }
function dateCourte(iso){ if(!iso) return "Pas encore envoyée"; return new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
const tache = id => TACHES.find(t=>t.id===id);
const tachesVisibles = () => TACHES.filter(t=>!t.alternance || etat.profil==="alternance");

function plafondAtteint(t){
  if (t.groupe){ const total = TACHES.filter(x=>x.groupe===t.groupe).reduce((s,x)=>s+(etat.faits[x.id]||0),0); return total >= PLAFONDS_GROUPES[t.groupe]; }
  return t.cap!=null && (etat.faits[t.id]||0) >= t.cap;
}

/* Valider une tâche : compte toujours l'effort, l'énergie seulement sous le plafond */
function valider(id){
  const t = tache(id);
  const bloque = plafondAtteint(t);
  etat.faits[id] = (etat.faits[id]||0) + 1;
  if (bloque){
    toast(`C'est noté ! Plafond du jour atteint pour « ${t.nom} », donc pas d'énergie en plus. Reviens demain.`);
  } else {
    const avant = etat.energie;
    etat.energie += t.e;
    toast(`<b>+${t.e} ⚡</b> ${esc(t.nom)}`, t.victoire);
    etat.poseTemp = t.victoire ? "fier" : "content";
    setTimeout(()=>{etat.poseTemp=null; if(etat.onglet==="accueil") rendreAccueil();}, 1800);
    if (avant < JAUGE_AVENTURE && etat.energie >= JAUGE_AVENTURE && !etat.aventureFaite)
      setTimeout(()=>toast(`La jauge est pleine ! ${esc(etat.nom)} est prêt pour l'aventure.`), 2200);
  }
  rendre();
}

let minuterieToast;
function toast(html, victoire=false){
  const el = $("#toast");
  el.innerHTML = html; el.classList.toggle("victoire", !!victoire); el.classList.remove("cache");
  clearTimeout(minuterieToast); minuterieToast = setTimeout(()=>el.classList.add("cache"), 2600);
}

   ============================================================ */
function phraseZiggy(){
  const n = esc(etat.nom);
  if (etat.aventureFaite) return `Quelle journée ! Je t'ai tout raconté dans <b>Clairbourg</b>. Demain matin, on repart de zéro, ensemble.`;
  if (etat.energie >= JAUGE_AVENTURE) return `J'ai plein d'énergie ! On part explorer <b>Clairbourg</b> ?`;
  const due = etat.candidatures.find(c=>c.envoyee && !c.relancee && c.reponse==="attente" && joursDepuis(c.date)>=RELANCE_JOURS);
  if (due) return `Psst, ${esc(etat.prenom)}… <b>${esc(due.entreprise)}</b> n'a pas répondu depuis ${joursDepuis(due.date)} jours. On les relance ?`;
  return `Bonjour ${esc(etat.prenom)} ! Chaque petit pas me donne de l'énergie. On commence par quoi ?`;
}
function poseAccueil(){
  if (etat.poseTemp) return etat.poseTemp;
  if (etat.aventureFaite) return "dort";
  if (etat.energie >= JAUGE_AVENTURE) return "excite";
  return "neutre";
}
function rendreAccueil(){
  const e = Math.min(etat.energie, JAUGE_AVENTURE);
  const pleine = etat.energie >= JAUGE_AVENTURE;
  let bas;
  if (etat.aventureFaite) bas = `<small>Aventure du jour terminée. ${esc(etat.nom)} se repose. La jauge revient à 0 demain matin, et tes tâches comptent toujours.</small>`;
  else if (pleine) bas = `<button class="btn pulse" id="partir">Envoyer ${esc(etat.nom)} à l'aventure</button>`;
  else bas = `<small>Encore ${JAUGE_AVENTURE-e} points pour que ${esc(etat.nom)} parte à l'aventure.</small>`;

  const groupes = ETAPES.map(nomEtape => {
    const liste = tachesVisibles().filter(t=>t.etape===nomEtape);
    if (!liste.length) return "";
    const gagne = liste.reduce((s,t)=>s+(etat.faits[t.id]||0),0);
    const lignes = liste.map(t=>{
      const n = etat.faits[t.id]||0;
      const plafond = plafondAtteint(t);
      const capTxt = t.groupe ? `${TACHES.filter(x=>x.groupe===t.groupe).reduce((s,x)=>s+(etat.faits[x.id]||0),0)}/${PLAFONDS_GROUPES[t.groupe]} pour les pauses`
                   : t.cap==null ? (n? `Fait ${n} fois aujourd'hui` : "Sans plafond") : `${n}/${t.cap} aujourd'hui`;
      const sous = t.auto ? "Se coche tout seul depuis le tableau" : (plafond ? "Plafond atteint, merci pour l'effort !" : capTxt);
      return `<button class="tache ${n?"faite":""} ${plafond&&!t.auto?"plafond":""} ${t.auto?"auto":""}" data-tache="${t.id}">
        <span class="coche">${n?`<svg width="14" height="12" viewBox="0 0 14 12"><path d="M1.5 6.5 5 10l7.5-8.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</span>
        <span><span class="nom">${esc(t.nom)}</span><span class="sous">${sous}</span></span>
        <span class="gain">+${t.e}</span></button>`;
    }).join("");
    return `<details class="etape" data-etape="${nomEtape}" ${etat.ouvertes.has(nomEtape)?"open":""}>
      <summary><span>${nomEtape}</span><span class="meta">${gagne? `${gagne} faite${gagne>1?"s":""}`:""}<svg class="fleche" width="8" height="12" viewBox="0 0 8 12"><path d="M1.5 1.5 6 6l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></summary>
      ${lignes}</details>`;
  }).join("");

  $("#ecran-accueil").innerHTML = `
    <div class="scene">${decor()}
      <div class="bulle">${phraseZiggy()}</div>
      ${ziggy(poseAccueil(), etat.poseTemp?"saut":"respire")}
    </div>
    <div class="jauge">
      <div class="jauge-haut"><strong>Énergie de ${esc(etat.nom)}</strong><span>${e} / ${JAUGE_AVENTURE} ⚡</span></div>
      <div class="piste" role="progressbar" aria-valuemin="0" aria-valuemax="${JAUGE_AVENTURE}" aria-valuenow="${e}" aria-label="Énergie du jour">
        <div class="remplissage" style="width:${e/JAUGE_AVENTURE*100}%"></div><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
      ${bas}
    </div>
    <div class="pad">
      <h3 class="section-titre">Tes tâches du jour</h3>
      ${groupes}
      <p class="note-maquette">Vendredi 25 septembre · profil ${etat.profil==="alternance"?"Alternance":"Emploi"}</p>
    </div>`;
  const b = $("#partir"); if (b) b.onclick = lancerAventure;
}

function lancerAventure(){
  $("#calque").innerHTML = `<div class="plein aventure" role="dialog" aria-label="Départ en aventure">
    <div style="width:100%;overflow:hidden">${ziggy("aventure","marche")}</div>
    <h3>${esc(etat.nom)} part explorer Clairbourg…</h3>
    <div class="points"><i></i><i></i><i></i></div></div>`;
  $("#calque .ziggy").style.width = "170px";
  setTimeout(retourAventure, 2400);
}
function retourAventure(){
  const r = RECITS[etat.recitIndex % RECITS.length]; etat.recitIndex++;
  const restants = ACCESSOIRES.filter(a=>!etat.possede.includes(a.id));
  const gain = restants.length ? restants[Math.floor(Math.random()*restants.length)] : null;
  if (gain) etat.possede.push(gain.id);
  const lieu = etat.lieux.find(l=>l.nom===r.lieu); if (lieu) lieu.etat = r.etat;
  etat.journal.unshift({date:"Aujourd'hui", texte:r.texte, gain: gain?gain.nom:null});
  etat.aventureFaite = true;
  $("#calque").innerHTML = `<div class="plein aventure" role="dialog" aria-label="Retour d'aventure">
    ${ziggy("content","saut")}
    <h3>${esc(etat.nom)} est rentré !</h3>
    <div class="recit"><p>${tx(r.texte)}</p>
      ${gain?`<div class="recompense"><span class="obj">${ICONES_OBJ[gain.id]}</span><span><small>Il a trouvé</small>${esc(gain.nom)}</span></div>`:""}</div>
    <div class="actions"><button class="btn" id="porter">${gain?"L'essayer tout de suite":"Merci Ziggy !"}</button>
    <button class="btn second" id="fermer">Retour au jardin</button></div></div>`;
  $("#porter").onclick = ()=>{ if(gain && !etat.porte.includes(gain.id)) etat.porte.push(gain.id); fermer(); aller(gain?"moi":"accueil"); };
  $("#fermer").onclick = fermer;
  rendre();
}
function fermer(){ $("#calque").innerHTML = ""; rendre(); }

/* ============================================================
   CANDIDATURES
   ============================================================ */
const FILTRES = [
  ["toutes","Toutes", c=>true],
  ["aenvoyer","À envoyer", c=>!c.envoyee],
  ["envoyees","Envoyées", c=>c.envoyee],
  ["relancees","Relancées", c=>c.relancee],
  ["entretien","Entretien", c=>c.entretien],
  ["attente","En attente", c=>c.envoyee && c.reponse==="attente"],
  ["refus","Refus", c=>c.reponse==="refus"],
  ["decroche","Décroché !", c=>c.reponse==="decroche"],
];
function infoRelance(c){
  if (!c.envoyee || c.relancee || c.reponse!=="attente") return "";
  const reste = RELANCE_JOURS - joursDepuis(c.date);
  return reste<=0 ? `<span class="relance due">Relance à faire</span>` : `<span class="relance">Relance dans ${reste} j</span>`;
}
function rendreCandidatures(){
  const f = FILTRES.find(x=>x[0]===etat.filtre);
  const liste = etat.candidatures.filter(f[2]);
  const rep = {attente:"En attente", refus:"Refus", decroche:"Décroché !"};
  $("#ecran-candidatures").innerHTML = `
    <div class="entete"><h2>Candidatures</h2><p>${etat.candidatures.filter(c=>c.envoyee).length} envoyées · ${etat.candidatures.filter(c=>c.entretien).length} entretien · ${etat.courage} refus encaissé${etat.courage>1?"s":""} avec courage</p></div>
    <div class="filtres" role="toolbar" aria-label="Filtrer par statut">${FILTRES.map(([id,lab,fn])=>`<button data-filtre="${id}" aria-pressed="${id===etat.filtre}">${lab}<span>${etat.candidatures.filter(fn).length}</span></button>`).join("")}</div>
    <div class="pad">${liste.length? liste.map(c=>`
      <button class="fiche" data-fiche="${c.id}">
        <div class="fiche-haut"><div><h3>${esc(c.entreprise)}</h3><div class="poste">${esc(c.poste)}</div></div>
          <span class="etiq ${c.type}">${c.type==="offre"?"Sur offre":"Spontanée"}</span></div>
        <div class="etapes-fiche">
          <span class="pas ${c.envoyee?"ok":""}">Envoyée</span><span class="pas ${c.relancee?"ok":""}">Relancée</span><span class="pas ${c.entretien?"ok entretien":""}">Entretien</span></div>
        <div class="fiche-bas"><span>${c.envoyee?"Envoyée le "+dateCourte(c.date):"Offre sauvegardée"}</span>
          ${c.envoyee? (infoRelance(c) || `<span class="reponse ${c.reponse}">${rep[c.reponse]}</span>`) : `<span class="relance">À envoyer</span>`}</div>
      </button>`).join("") : `<p class="vide">Rien ici pour l'instant. Ça viendra !</p>`}
    </div>`;
}

function ouvrirFiche(id){
  const c = etat.candidatures.find(x=>x.id===id);
  const toggle = (cle, titre, sous) => `<div class="ligne-toggle"><span>${titre}<small>${sous}</small></span>
     <button class="interrupteur" role="switch" aria-checked="${c[cle]}" data-cle="${cle}" aria-label="${titre}"></button></div>`;
  $("#calque").innerHTML = `<div class="voile" id="voile"><div class="feuille" role="dialog" aria-label="Fiche ${esc(c.entreprise)}">
    <div class="poignee"></div>
    <h3>${esc(c.entreprise)}</h3><p class="poste">${esc(c.poste)}</p>
    <div class="bloc"><dl class="infos">
      <dt>Type</dt><dd>${c.type==="offre"?"Candidature sur offre":"Candidature spontanée"}</dd>
      <dt>Envoi</dt><dd>${dateCourte(c.date)}</dd>
      <dt>Annonce</dt><dd>${c.lien?esc(c.lien):"—"}</dd></dl></div>
    <div class="bloc">
      ${toggle("envoyee","Candidature envoyée", c.type==="offre"?"+10 ⚡":"+15 ⚡")}
      ${toggle("relancee","Relance faite","+10 ⚡")}
      ${toggle("entretien","Entretien obtenu","+20 ⚡, une victoire !")}
    </div>
    <p class="label">Réponse</p>
    <div class="segment" role="group" aria-label="Réponse">
      <button data-rep="attente" aria-pressed="${c.reponse==="attente"}">En attente</button>
      <button data-rep="refus" aria-pressed="${c.reponse==="refus"}">Refus</button>
      <button class="dec" data-rep="decroche" aria-pressed="${c.reponse==="decroche"}">Décroché !</button></div>
    <p class="label"><label for="note-${c.id}">Note</label></p>
    <textarea class="champ" id="note-${c.id}" placeholder="Ce qui s'est dit, le nom du recruteur, ton ressenti…">${esc(c.note)}</textarea>
    <div class="duo"><button class="btn second" id="fermer-fiche">Fermer</button><button class="btn" id="ok-fiche">Enregistrer</button></div>
  </div></div>`;
  const sauverNote = ()=>{ c.note = $(`#note-${c.id}`).value; };
  $("#voile").onclick = e=>{ if(e.target.id==="voile"){ sauverNote(); fermer(); } };
  $("#fermer-fiche").onclick = ()=>{ sauverNote(); fermer(); };
  $("#ok-fiche").onclick = ()=>{ sauverNote(); fermer(); toast("Fiche enregistrée"); };
  document.querySelectorAll("#calque .interrupteur").forEach(b=>b.onclick=()=>{
    const cle = b.dataset.cle; c[cle] = !c[cle]; b.setAttribute("aria-checked", c[cle]);
    if (!c[cle]) return;                   // décocher ne retire jamais d'énergie
    c.recu = c.recu || {};
    if (c.recu[cle]) return;               // pas de double énergie pour la même fiche
    c.recu[cle] = true;
    if (cle==="envoyee"){ if(!c.date) c.date="2026-09-25"; valider(c.type==="offre"?"envoi":"spontanee"); }
    if (cle==="relancee") valider("relance");
    if (cle==="entretien") valider("entretien");
  });
  document.querySelectorAll("#calque [data-rep]").forEach(b=>b.onclick=()=>{
    const r = b.dataset.rep; if (r===c.reponse) return;
    sauverNote(); c.reponse = r;
    if (r==="refus"){ valider("refus"); etat.courage++; ecranReconfort(c); }
    else if (r==="decroche"){ ecranFete(c); }
    else ouvrirFiche(c.id);
  });
}

function ouvrirAjout(){
  let type="offre", envoyee=false;
  $("#calque").innerHTML = `<div class="voile" id="voile"><form class="feuille" id="form-ajout" role="dialog" aria-label="Nouvelle candidature">

    <div class="duo"><button type="button" class="btn second" id="a-annuler">Annuler</button><button class="btn" type="submit">Ajouter</button></div>
  </form></div>`;
  const majGain = ()=>{ $("#a-gain").textContent = envoyee ? (type==="offre"?"+10 ⚡ pour l'envoi":"+15 ⚡ pour une spontanée") : "Sinon, elle est gardée comme offre sauvegardée (+2 ⚡)"; };
  document.querySelectorAll("#a-type button").forEach(b=>b.onclick=()=>{ type=b.dataset.v; document.querySelectorAll("#a-type button").forEach(x=>x.setAttribute("aria-pressed", x===b)); majGain(); });
  $("#a-env").onclick = ()=>{ envoyee=!envoyee; $("#a-env").setAttribute("aria-checked", envoyee); majGain(); };
  $("#a-annuler").onclick = fermer;
  $("#voile").onclick = e=>{ if(e.target.id==="voile") fermer(); };
  $("#form-ajout").onsubmit = e=>{
    e.preventDefault();
    const ent = $("#a-ent").value.trim(); if(!ent) return;
    const c = {id:Date.now(), entreprise:ent, poste:$("#a-poste").value.trim()||"Poste à préciser", lien:$("#a-lien").value.trim(), type, date: envoyee?"2026-09-25":"", envoyee, relancee:false, entretien:false, reponse:"attente", note:"", recu:{envoyee}};
    etat.candidatures.unshift(c); etat.filtre="toutes"; fermer();
    valider(envoyee ? (type==="offre"?"envoi":"spontanee") : "offre");
  };
  $("#a-ent").focus();
}

function ecranReconfort(c){
  $("#calque").innerHTML = `<div class="plein reconfort" role="dialog" aria-label="Message de ${esc(etat.nom)}">

        <button class="reglage danger" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" id="r-effacer">Effacer mes données</button>
      </div>
      <p class="note-maquette">Maquette : les images de Ziggy et du décor se chargent depuis maquette/illustrations/ une fois ajoutées.</p>
    </div>`;
  $("#r-nom").onchange = e=>{ const v=e.target.value.trim(); if(v){ etat.nom=v; toast(`Ton compagnon s'appelle maintenant ${esc(v)}`); rendre(); } };
  $("#r-prenom").onchange = e=>{ const v=e.target.value.trim(); if(v){ etat.prenom=v; rendre(); } };
  document.querySelectorAll("[data-profil]").forEach(b=>b.onclick=()=>{ etat.profil=b.dataset.profil; etat.ouvertes.add("Alternance"); toast(etat.profil==="alternance"?"Les tâches alternance sont ajoutées à ton accueil":"Profil Emploi : les tâches alternance sont retirées"); rendre(); });
  $("#r-notif").onclick = ()=>{ etat.relanceNotif=!etat.relanceNotif; rendre(); };
  $("#r-effacer").onclick = ()=>toast("Dans l'app, une confirmation sera demandée avant d'effacer.");
  document.querySelectorAll("[data-objet]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.objet; if(!etat.possede.includes(id)){ toast(`${esc(etat.nom)} le trouvera peut-être lors d'une prochaine aventure.`); return; }
    etat.porte = etat.porte.includes(id) ? etat.porte.filter(x=>x!==id) : [...etat.porte,id]; rendre();
  });
}

/* ============================================================
   NAVIGATION ET RENDU
   ============================================================ */
function aller(onglet){
  etat.onglet = onglet;
  ["accueil","candidatures","clairbourg","moi"].forEach(o=>{ $("#ecran-"+o).hidden = o!==onglet; });
  document.querySelectorAll("[data-onglet]").forEach(b=>{ if(b.dataset.onglet===onglet) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#fab").hidden = onglet!=="candidatures";
  $("#ecran-"+onglet).scrollTop = 0;
  rendre();
}
function rendre(){
  const fn = {accueil:rendreAccueil, candidatures:rendreCandidatures, clairbourg:rendreClairbourg, moi:rendreMoi}[etat.onglet];
  const el = $("#ecran-"+etat.onglet); const y = el.scrollTop;
  fn(); el.scrollTop = y;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tache]");
  if (t){ const tc = tache(t.dataset.tache);
    if (tc.auto){ toast("Cette tâche se valide toute seule quand tu mets à jour une candidature."); aller("candidatures"); }
    else valider(tc.id); return; }
  const o = e.target.closest("[data-onglet]"); if (o){ aller(o.dataset.onglet); return; }
  const a = e.target.closest("[data-aller]"); if (a){ fermer(); aller(a.dataset.aller); return; }
  const f = e.target.closest("[data-filtre]"); if (f){ etat.filtre=f.dataset.filtre; rendre(); return; }
  const fi = e.target.closest("[data-fiche]"); if (fi){ ouvrirFiche(+fi.dataset.fiche); return; }
});
document.addEventListener("toggle", e=>{
  const d = e.target; if (!d.matches || !d.matches("details[data-etape]")) return;
  d.open ? etat.ouvertes.add(d.dataset.etape) : etat.ouvertes.delete(d.dataset.etape);
}, true);
$("#fab").onclick = ouvrirAjout;
$("#demo-jauge").onclick = ()=>{ fermer(); etat.energie = Math.max(etat.energie, JAUGE_AVENTURE); etat.aventureFaite=false; aller("accueil"); };
$("#demo-matin").onclick = ()=>{ fermer(); etat.energie=0; etat.faits={}; etat.aventureFaite=false; aller("accueil"); toast("Nouveau matin : la jauge repart de 0."); };

aller("accueil");
</script>
